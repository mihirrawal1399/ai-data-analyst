name: CD Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy on Oracle VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.VM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/ai-data-analyst"; fi

            REPO_URL="${{ secrets.VM_REPO_URL }}"
            if [ -z "$REPO_URL" ]; then
              echo "VM_REPO_URL secret is required"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose -f deploy/oracle-vm/docker-compose.oracle-vm.yml up -d --build --remove-orphans
            docker image prune -f
