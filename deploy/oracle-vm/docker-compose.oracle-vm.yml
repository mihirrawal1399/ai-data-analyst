name: ai-data-analyst-oracle

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/oracle-vm/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PORT: 4000
      MCP_DB_URL: http://mcp-db:5001/mcp_db
      MCP_DB_PORT: 5001
    depends_on:
      - mcp-db
    networks:
      - app_net

  mcp-db:
    build:
      context: ../..
      dockerfile: deploy/oracle-vm/Dockerfile.mcp-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_DB_PORT: 5001
    expose:
      - "5001"
    networks:
      - app_net

  worker:
    build:
      context: ../..
      dockerfile: deploy/oracle-vm/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
